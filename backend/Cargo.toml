[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# Core runtime
tokio = { version = "1.47", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "uuid",
  "time",
  "migrate",
  "macros",
] }
axum = { version = "0.8", features = ["json", "query", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
  "cors",
  "set-header",
  "limit",
  "request-id",
  "timeout",
  "trace",
] }

# Serde / validation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identity & crypto
argon2 = "0.5"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

# Types
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing", "macros"] }
base64 = "0.22"
hex = "0.4"
urlencoding = "2"

# HTTP client (OAuth, outbound calls)
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }

# Storage
aws-sdk-s3 = "1"
aws-config = "1"
futures = "0.3"
bytes = "1"

# OpenAPI
utoipa = { version = "5", features = ["uuid", "time", "axum_extras"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

thiserror = "2"

# CLI / shared app tooling
clap = { version = "4", features = ["derive", "env"] }
toml = "0.9"
console = "0.16"
glob = "0.3"

[profile.release]
lto = "thin"
strip = "symbols"
